[project]
name = "eleusis"
version = "0.7.6"
description = "A long-horizon inductive-reasoning card game environment with native tool calling."
tags = ["eleusis", "card-game", "multiturn", "tool-use", "inductive-reasoning", "eval", "verifiers"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers>=0.3.0,<0.4",
    "datasets>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eleusis"]

[tool.verifiers.eval]
num_examples = 512
rollouts_per_example = 1
