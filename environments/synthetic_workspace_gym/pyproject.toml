[project]
name = "synthetic-workspace-gym"
version = "0.2.1"
description = "Native Verifiers V1 workspace tasks for training terminal agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yadnyesh Chakane" }]
tags = ["multi-turn", "tool-use", "workspace", "code", "v1"]
dependencies = ["huggingface-hub>=0.28,<2", "verifiers>=0.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synthetic_workspace_gym"]

[tool.verifiers.eval]
num_examples = 50
rollouts_per_example = 1
