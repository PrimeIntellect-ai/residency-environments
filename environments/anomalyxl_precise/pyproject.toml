[project]
name = "anomalyxl_precise"
version = "0.1.0"
description = "AnomalyXL-precise — evidence-grounded long-context anomaly QA as a Verifiers v1 taskset"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "prime-pydantic-config>=0.4.2",
    "verifiers>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anomalyxl_precise"]

[tool.verifiers.eval]
num_examples = 800
rollouts_per_example = 1
