[project]
name = "periapical-lesions"
version = "0.3.7"
description = "File periapical lesion reports (PAI 3-5) for dental pantomographs at an offline reporting workstation"
readme = "README.md"
tags = ["dental", "vision", "detection", "multi-turn", "train", "eval"]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["licenses/LICENSE", "licenses/NOTICE"]
dependencies = [
    "datasets>=3.0",
    "numpy",
    "scipy",
    "verifiers>=0.4.0,<0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["periapical_lesions"]

[tool.verifiers.eval]
num_examples = 387
rollouts_per_example = 1
