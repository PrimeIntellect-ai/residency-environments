[project]
name = "drug-perturbation"
version = "0.1.0"
description = "Drug perturbation prediction with optional intermediate tasks and process-reward dampening."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "verifiers>=0.3.1,<0.4",
    "huggingface-hub>=0.34",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "rdkit>=2024.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drug_perturbation"]

[tool.verifiers.eval]
num_examples = 100
rollouts_per_example = 8
