[project]
name = "agentboard-babyai"
description = "AgentBoard BabyAI text-game environment for Verifiers v1"
tags = ["agentboard", "babyai", "game", "multi-turn", "eval", "train", "v1"]
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "gymnasium==1.3.0",
    "minigrid==2.3.0",
    "numpy>=1.26.0",
    "pydantic>=2.11.9",
    "verifiers>=0.4.0,<0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "agentboard_babyai.py",
    "agentboard_babyai_runtime.py",
    "assets/**",
    "licenses/**",
    "NOTICE.md",
    "UPSTREAM_AGENTBOARD.md",
    "pyproject.toml",
    "README.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "agentboard_babyai.py",
    "agentboard_babyai_runtime.py",
    "assets/**",
    "licenses/**",
    "NOTICE.md",
    "UPSTREAM_AGENTBOARD.md",
    "pyproject.toml",
    "README.md",
]

[tool.verifiers.eval]
num_examples = 28
rollouts_per_example = 1
max_tokens = 1024
