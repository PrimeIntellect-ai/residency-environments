[project]
name = "aerialsim-flight"
version = "0.1.0"
description = "Drone flight missions in a photoreal Cosys-AirSim world, controlled through a Python drone API."
tags = ["aerialsim", "drone", "flight", "sandbox", "gpu", "eval", "verifiers"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "pillow>=10",
    "verifiers>=0.3.0,<0.4",
    "prime-sandboxes>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aerialsim_flight", "aerialsim_visual", "aerialsim_coding", "aerialsim_rehearsal"]

[tool.verifiers.eval]
num_examples = 3
rollouts_per_example = 1
