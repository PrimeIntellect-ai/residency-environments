[project]
name = "worldbench"
version = "0.1.0"
description = "WorldBench, a visually diverse multimodal reasoning benchmark, as a Verifiers taskset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.3,<6",
    "pillow>=10",
    "verifiers>=0.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldbench"]
