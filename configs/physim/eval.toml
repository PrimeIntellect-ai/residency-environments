# BF centered-pulse-v2 is the pinned default. Select a local bundle to override it.
model = "YOUR_MODEL_ID"
num_tasks = 1
num_rollouts = 1
max_concurrent = 1
push = false

[env.taskset]
id = "physim"

[env.taskset.task]
output_root = "outputs/r6/artifacts"
agent_image = "python:3.11-slim@sha256:db3ff2e1800a8581e2c48a27c3995339d47bdf046da21c7627accd3d51053a93"

[env.taskset.task.tools]
# bundle = "/path/to/bundle" # Optional override of the BF default.
max_experiments = 1000
max_total_tu = 50000
max_validation_attempts = 128
max_submission_attempts = 128

[env.agent]
# Generous exploration defaults; increase these together for longer investigations.
max_turns = 1024
max_output_tokens = 1048576

[env.agent.timeout]
rollout = 86400

[env.agent.harness]
id = "bash"
edit = true
search = false

[env.agent.runtime]
type = "prime"
image = "python:3.11-slim@sha256:db3ff2e1800a8581e2c48a27c3995339d47bdf046da21c7627accd3d51053a93"
workdir = "/workspace"
cpu = 4
memory = 8
allow = []

[env.agent.retries]
max_retries = 0

[env.retries]
max_retries = 0
