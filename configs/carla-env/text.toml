num_tasks = 19
num_rollouts = 2
max_concurrent = 2
push = false

[env.taskset]
id = "carla-env"
modality = "text"
families = ["decision", "maze", "navigation", "free_roam"]
seeds = [0, 1]

# Prime sandboxes do not expose ports, so the tool server shares the agent's VM.
[env.taskset.task.tools]
colocated = true

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "prime"
image = "sinatras/carla-env-runtime@sha256:602cc9ece967f16b73f4c809aa50ef7c7525a280ebbd1ef3d9f53634a0a23d23"
workdir = "/home/carla"
vm = true
cpu = 4
memory = 8
disk = 40

[env.agent.timeout]
setup = 600
rollout = 600
finalize = 120
