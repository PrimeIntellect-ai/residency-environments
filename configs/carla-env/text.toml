num_tasks = 19
num_rollouts = 2
max_concurrent = 2
push = false

[env.taskset]
id = "carla-env"
modality = "text"
families = ["decision", "maze", "navigation", "free_roam"]
seeds = [0, 1]

# Prime sandboxes do not expose ports, so the tool server shares the agent's VM.
[env.taskset.task.tools]
colocated = true

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "prime"
image = "sinatras/carla-env-runtime@sha256:e8593c615492d123413fcc0f3996a8b60b6754d32f8cb8facec349604eed46d5"
workdir = "/home/carla"
vm = true
cpu = 4
memory = 8
disk = 40

[env.agent.timeout]
setup = 600
rollout = 600
finalize = 120
