num_tasks = 13
num_rollouts = 2
max_concurrent = 2
push = false

[env.taskset]
id = "carla-env"
modality = "text"

# Prime sandboxes do not expose ports, so the tool server shares the agent's VM.
[env.taskset.task.tools]
colocated = true

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "prime"
image = "sinatras/carla-env-runtime@sha256:e3af793c6e8262bcd421dc67dd832de4959044e0003eceaed6f759cba84839d0"
workdir = "/home/carla"
vm = true
cpu = 4
memory = 8
disk = 40

[env.agent.timeout]
setup = 600
rollout = 600
finalize = 120
