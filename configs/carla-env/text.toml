num_tasks = 13
num_rollouts = 2
max_concurrent = 2
push = false

[env.taskset]
id = "carla-env"
modality = "text"

# Prime sandboxes do not expose ports, so the tool server shares the agent's VM.
[env.taskset.task.tools]
colocated = true

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "prime"
image = "sinatras/carla-env-runtime@sha256:1de41898269de257c9a8dc90626c9ad93a655129f4eec77d26c5113bb2440331"
workdir = "/home/carla"
vm = true
cpu = 4
memory = 8
disk = 40

[env.agent.timeout]
setup = 600
rollout = 600
finalize = 120
