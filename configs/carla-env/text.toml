num_tasks = 13
num_rollouts = 2
max_concurrent = 2
push = false

[env.taskset]
id = "carla-env"
modality = "text"

# Prime sandboxes do not expose ports, so the tool server shares the agent's VM.
[env.taskset.task.tools]
colocated = true

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "prime"
image = "sinatras/carla-env-runtime@sha256:222437d17104e84817d66b99d0c737893dbbae83a34733c5576feb2c11562b44"
workdir = "/home/carla"
vm = true
cpu = 4
memory = 8
disk = 40

[env.agent.timeout]
setup = 600
rollout = 600
finalize = 120
