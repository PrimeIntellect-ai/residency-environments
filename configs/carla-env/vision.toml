num_tasks = 19
num_rollouts = 2
max_concurrent = 1
push = false

[env.taskset]
id = "carla-env"
modality = "vision"
families = ["decision", "maze", "navigation", "free_roam"]
seeds = [0, 1]

[env.taskset.task.tools]
colocated = false

[env.taskset.task.tools.runtime]
type = "docker"
image = "sinatras/carla-env-runtime@sha256:6e065ae4719f38ae6cf526516f66a7282ba7ff3f14432249cb504609044b4ee5"
workdir = "/home/carla"
cpu = 4
memory = 8
gpu = "1"

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "prime"
vm = true

[env.agent.timeout]
setup = 600
rollout = 600
finalize = 120
