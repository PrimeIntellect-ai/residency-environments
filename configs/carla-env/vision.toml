num_tasks = 19
num_rollouts = 2
max_concurrent = 1
push = false

[env.taskset]
id = "carla-env"
modality = "vision"
families = ["decision", "maze", "navigation", "free_roam"]
seeds = [0, 1]

[env.taskset.task.tools]
colocated = false

[env.taskset.task.tools.runtime]
type = "docker"
image = "sinatras/carla-env-runtime@sha256:ba39559818e5bf029c3f9a84856c2cd1f082ec2a6e96eb90deb0222ac7163493"
workdir = "/home/carla"
cpu = 4
memory = 8
gpu = "1"

[env.agent.harness]
id = "null"

[env.agent.runtime]
type = "prime"
vm = true

# Optional safeguard: an expired rollout timeout fails the rollout without a score.
# To end episodes on time, set max_sim_seconds or max_wall_seconds in
# env.taskset.env_args instead.
[env.agent.timeout]
setup = 600
rollout = 600
finalize = 120
