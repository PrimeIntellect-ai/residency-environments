# Full benchmark: openai/gpt-6.1-sol on the Codex harness, 400M-token budget, 500 turns.
model = "openai/gpt-6.1-sol"
num_rollouts = 1
max_concurrent = 1
push = false

[sampling]
reasoning_effort = "max"

[env.taskset]
id = "pretrain-gym"

[env.taskset.task.scoring.eval_set]
token_env = "SCORER_HF_TOKEN"

# Downloads land on the GPU host's disk; keep room for scoring.
[env.taskset.task.hub]
max_download_gb = 500

[env.agent]
max_turns = 500

[env.agent.harness]
id = "codex"
tool_timeout = 7200.0

[env.agent.runtime]
type = "docker"
allow = []
