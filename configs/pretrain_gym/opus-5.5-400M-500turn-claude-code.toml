# Full benchmark: claude-opus-5-5 on the Claude Code harness through the Anthropic API, 400M-token budget, 500 turns.
model = "claude-opus-5-5"
num_rollouts = 1
max_concurrent = 1
push = false

[client]
type = "eval"
base_url = "https://api.anthropic.com"
api_key_var = "CLAUDE_API_KEY"

# A key that is not scoped to a workspace must name one on every request.
[client.headers_from_env]
anthropic-workspace-id = "CLAUDE_WORKSPACE_ID"

[sampling]
reasoning_effort = "max"

[env.taskset]
id = "pretrain-gym"

[env.taskset.task.scoring.eval_set]
token_env = "SCORER_HF_TOKEN"

# Downloads land on the GPU host's disk; keep room for scoring.
[env.taskset.task.hub]
max_download_gb = 500

[env.agent]
max_turns = 500

[env.agent.harness]
id = "claude-code"
# Opus 5.5 needs Claude Code 2.1.280 or newer; verifiers pins 2.1.278.
version = "2.1.292"

# Claude Code reads its MCP tool-call limit from this variable, not `tool_timeout`.
[env.agent.harness.env]
MCP_TOOL_TIMEOUT = "7200000"

[env.agent.runtime]
type = "docker"
allow = []
