model = "Qwen/Qwen3.5-9B"
num_rollouts = 1
max_concurrent = 2
push = true
output_dir = "outputs/agentboard-babyai"

[env.taskset]
id = "agentboard-babyai"
split = "eval_1_per_subtask"
base_seed = 1234

[env.agent]
max_turns = 20

[env.agent.runtime]
type = "subprocess"

[env.agent.timeout]
setup = 120
rollout = 300

[client]
type = "eval"
base_url = "https://api.pinference.ai/api/v1"
api_key_var = "PRIME_API_KEY"

[client.timeout]
read = 120

[sampling]
temperature = 0.7
max_tokens = 1024
top_k = -1
min_p = 0.0

[sampling.chat_template_kwargs]
enable_thinking = false
