num_tasks = 69
num_rollouts = 1
# Each rollout holds two GPUs while it is scored: its agent and scoring sandboxes.
max_concurrent = 2
push = false

[env.taskset]
id = "pmpp-hard"

[env.taskset.task]
arch = "sm_120"
require_perf = true
held_out = true
score_runtime_type = "prime"
score_prime_gpu = "RTX_PRO_6000"
score_prime_disk = 50.0
score_cpu = 8.0
score_memory = 32.0
perf_ratio_target = 1.25
perf_ratio_runs = 5
# Every Prime scoring sandbox has its own GPU, so grading needs no shared lock.
gpu_lock = false
always_submit = true
single_shot = false
expected_perf_gated = 48
residency_check = true
source_policy = true
triton_premise = true
kernelguard_check = true

# Built on Prime by scripts/pmpp-hard/push-prime-images.sh.
[env.taskset.task.agent_images]
cuda = "prime/sinatras/pmpp-cuda-agent:cu128"
triton = "prime/sinatras/pmpp-triton:cu128"
cutlass = "prime/sinatras/pmpp-cutlass:12.8.1"

[env.taskset.task.score_images]
cuda = "prime/sinatras/pmpp-cuda-agent:cu128"
triton = "prime/sinatras/pmpp-triton:cu128"
cutlass = "prime/sinatras/pmpp-cutlass:12.8.1"

[env.agent.harness]
id = "bash"

[env.agent.runtime]
type = "prime"
image = "prime/sinatras/pmpp-cuda-agent:cu128"
workdir = "/app"
gpu = "RTX_PRO_6000"
cpu = 4.0
memory = 8.0
disk = 50.0

[env.agent.timeout]
setup = 1200.0
rollout = 1500.0
finalize = 120.0
scoring = 1800.0
