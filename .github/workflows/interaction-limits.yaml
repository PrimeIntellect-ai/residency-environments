name: Renew interaction limits

# GitHub interaction limits expire after at most 6 months. This keeps the repo
# permanently in "collaborators only" mode: only collaborators (residents with
# triage access + maintainers) can open issues/PRs or comment, even though the
# repo is public.
#
# Requires an `ADMIN_TOKEN` secret: a fine-grained PAT with Administration
# read/write on this repo (the default GITHUB_TOKEN cannot set interaction limits).

on:
  schedule:
    - cron: "17 4 1 * *" # monthly
  workflow_dispatch:

permissions: {}

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set interaction limit to collaborators only
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/interaction-limits" \
            -f limit=collaborators_only -f expiry=six_months
          gh api "repos/${{ github.repository }}/interaction-limits"
