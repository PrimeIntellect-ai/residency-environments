name: Integration tests

# Smoke-evals that need API keys (real model rollouts).
#
# Trigger: add the `safe-to-test` label to a PR (remove + re-add to re-run
# after new commits), or run manually via workflow_dispatch.
#
# SECURITY: all secrets live on the `integration` GitHub Environment, which has
# required reviewers — a maintainer must approve every run before secrets are
# injected, regardless of who triggered the run or what the workflow file on
# the PR branch says. Never move these secrets to repo level: contributors have
# write access, and repo-level secrets would be exposed to any workflow edit on
# a branch.

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'safe-to-test'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: integration
    env:
      PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
      PRIME_TEAM_ID: ${{ secrets.PRIME_TEAM_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # Needed to get PR diff

      - name: Detect changed environments
        id: changed-envs
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v47
        with:
          path: environments
          dir_names: true
          dir_names_max_depth: 1
          separator: ","

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run integration tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            export CHANGED_ENVS="${{ steps.changed-envs.outputs.all_changed_files || 'none' }}"
            echo "CHANGED_ENVS: $CHANGED_ENVS"
          fi
          uv run pytest -n auto tests -v
