name: Integration tests

# Every PR head is classified automatically. Environment changes wait for approval
# on the protected `integration` Environment, then run real model rollouts.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect environment changes
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.changed-envs.outputs.all_modified_files }}
      changed: ${{ steps.changed-envs.outputs.any_modified }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed environments
        id: changed-envs
        uses: tj-actions/changed-files@v47
        with:
          path: environments
          dir_names: true
          dir_names_max_depth: 1
          separator: ","

  integration:
    name: Run environment integration tests
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: integration
    env:
      PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
      PRIME_TEAM_ID: ${{ secrets.PRIME_TEAM_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CHANGED_ENVS: ${{ needs.changes.outputs.environments }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run integration tests
        run: uv run pytest -n auto tests -m integration -v

  gate:
    name: Integration gate
    if: always()
    needs: [changes, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check integration result
        env:
          CHANGED: ${{ needs.changes.outputs.changed }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$CHANGED" = true ]; then
            test "$INTEGRATION_RESULT" = success
          else
            test "$INTEGRATION_RESULT" = skipped
          fi
