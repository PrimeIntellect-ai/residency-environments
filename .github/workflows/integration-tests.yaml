name: Integration tests

# Smoke-evals that need API keys. Maintainer-gated two ways:
#   1. Only runs when a maintainer adds the `safe-to-test` label (the label is
#      stripped on every new push by remove-safe-to-test-label.yaml, so new
#      commits always need re-approval).
#   2. The job uses the `integration` GitHub Environment, which should be
#      configured with required reviewers, so secrets are only exposed after an
#      explicit human approval.
# Can also be run manually against a PR via workflow_dispatch.

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to test (leave empty to test main)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'safe-to-test'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: integration
    env:
      PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
      PRIME_TEAM_ID: ${{ secrets.PRIME_TEAM_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Resolve ref to test
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "ref=refs/pull/${{ github.event.pull_request.number }}/merge" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.pr_number }}" ]; then
            echo "ref=refs/pull/${{ inputs.pr_number }}/merge" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code under test
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          submodules: true
          fetch-depth: 0

      - name: Detect changed environments
        id: changed-envs
        if: github.event_name == 'pull_request_target'
        uses: tj-actions/changed-files@v47
        with:
          path: environments
          dir_names: true
          dir_names_max_depth: 1
          separator: ","

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run integration tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            export CHANGED_ENVS="${{ steps.changed-envs.outputs.all_changed_files || 'none' }}"
            echo "CHANGED_ENVS: $CHANGED_ENVS"
          fi
          uv run pytest -n auto tests -v
