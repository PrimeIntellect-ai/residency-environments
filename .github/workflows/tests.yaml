name: Tests

# Cheap, secretless checks run on every PR update, including drafts.
# This workflow must never reference secrets: it executes contributor code.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Detect changed environments
        id: changed-envs
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v47
        with:
          path: environments
          dir_names: true
          dir_names_max_depth: 1
          separator: ","

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            export CHANGED_ENVS="${{ steps.changed-envs.outputs.all_modified_files || 'none' }}"
            echo "CHANGED_ENVS: $CHANGED_ENVS"
          fi
          uv run pytest -n auto tests -m "not integration" -v
